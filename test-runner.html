<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One-Page Studio — Regression Test Runner</title>
<style>
  :root {
    --pass: #2d7d46; --fail: #c8392b; --skip: #888; --pending: #b8962e;
    --bg: #f5f5f2; --panel: #ffffff; --border: #d8d4cb; --ink: #1a1a18;
    --ink-faint: #9a9a94; --mono: 'Menlo','Consolas',monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--mono); background: var(--bg); display: flex; height: 100vh; overflow: hidden; }

  /* ── Left panel ── */
  #sidebar {
    width: 420px; min-width: 320px; display: flex; flex-direction: column;
    border-right: 2px solid var(--border); background: var(--panel); overflow: hidden;
  }
  #sidebar-header {
    padding: 16px; border-bottom: 1.5px solid var(--border); flex-shrink: 0;
  }
  #sidebar-header h1 { font-size: 14px; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 10px; }
  #controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  button.ctrl {
    padding: 6px 14px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em;
    text-transform: uppercase; cursor: pointer; border-radius: 3px; border: 1.5px solid var(--border);
    background: transparent; color: var(--ink); transition: all 0.15s;
  }
  button.ctrl:hover { border-color: var(--ink); }
  button.ctrl.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  button.ctrl.danger  { background: var(--fail); color: #fff; border-color: var(--fail); }
  button.ctrl:disabled { opacity: 0.4; pointer-events: none; }

  #progress-bar-wrap { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  #progress-bar { height: 100%; width: 0%; background: var(--pass); transition: width 0.3s; border-radius: 3px; }

  #summary {
    display: flex; gap: 16px; padding: 8px 16px; border-bottom: 1.5px solid var(--border);
    font-size: 11px; flex-shrink: 0;
  }
  .sum-item { display: flex; align-items: center; gap: 5px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot.pass { background: var(--pass); }
  .dot.fail { background: var(--fail); }
  .dot.skip { background: var(--skip); }
  .dot.pending { background: var(--pending); }

  #filter-bar {
    padding: 8px 16px; border-bottom: 1.5px solid var(--border); display: flex; gap: 6px; flex-shrink: 0;
  }
  .filter-btn {
    padding: 3px 10px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em;
    text-transform: uppercase; cursor: pointer; border-radius: 3px;
    border: 1.5px solid var(--border); background: transparent; color: var(--ink-faint);
  }
  .filter-btn.active { background: var(--ink); color: #fff; border-color: var(--ink); }

  #test-list { overflow-y: auto; flex: 1; padding: 8px 0; }

  .group-header {
    padding: 6px 16px; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--ink-faint); background: var(--bg); position: sticky; top: 0; z-index: 1;
    display: flex; justify-content: space-between; align-items: center;
  }
  .group-count { font-size: 10px; color: var(--ink-faint); }

  .test-item {
    padding: 7px 16px; border-bottom: 1px solid #f0ede6; cursor: pointer;
    display: flex; align-items: flex-start; gap: 10px; transition: background 0.1s;
  }
  .test-item:hover { background: #fafaf8; }
  .test-item.current { background: #fffbe6; }
  .test-icon { flex-shrink: 0; margin-top: 2px; font-size: 12px; width: 16px; text-align: center; }
  .test-name { font-size: 12px; line-height: 1.4; flex: 1; }
  .test-group-tag { font-size: 10px; color: var(--ink-faint); margin-top: 2px; }
  .test-error { font-size: 10px; color: var(--fail); margin-top: 3px; font-style: italic; }

  /* ── Right panel ── */
  #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #app-frame-wrap { flex: 1; position: relative; overflow: hidden; }
  #app-frame { width: 100%; height: 100%; border: none; }
  #overlay-msg {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(250,249,246,0.85); font-size: 13px; color: var(--ink-faint);
    font-family: var(--mono); pointer-events: none; opacity: 0; transition: opacity 0.2s;
  }
  #overlay-msg.visible { opacity: 1; }
  #log-panel {
    height: 120px; border-top: 1.5px solid var(--border); overflow-y: auto;
    padding: 8px 16px; font-size: 11px; color: var(--ink-faint); background: #f8f7f4;
    flex-shrink: 0;
  }
  .log-line { padding: 1px 0; }
  .log-line.pass { color: var(--pass); }
  .log-line.fail { color: var(--fail); }
  .log-line.info { color: var(--ink-faint); }
  .log-line.warn { color: var(--pending); }
</style>
</head>
<body>

<div id="sidebar">
  <div id="sidebar-header">
    <h1>Regression Tests</h1>
    <div id="controls">
      <button class="ctrl primary" id="btn-run-all">▶ Run All</button>
      <button class="ctrl" id="btn-run-failed" disabled>↺ Re-run Failed</button>
      <button class="ctrl danger" id="btn-stop" disabled>■ Stop</button>
      <button class="ctrl" id="btn-reset">⊘ Reset</button>
    </div>
    <div id="progress-bar-wrap"><div id="progress-bar"></div></div>
  </div>
  <div id="summary">
    <div class="sum-item"><div class="dot pass"></div><span id="cnt-pass">0 pass</span></div>
    <div class="sum-item"><div class="dot fail"></div><span id="cnt-fail">0 fail</span></div>
    <div class="sum-item"><div class="dot skip"></div><span id="cnt-skip">0 skip</span></div>
    <div class="sum-item"><div class="dot pending"></div><span id="cnt-pending">0 pending</span></div>
    <div class="sum-item" style="margin-left:auto;color:var(--ink-faint)" id="elapsed"></div>
  </div>
  <div id="filter-bar">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="fail">Failed</button>
    <button class="filter-btn" data-filter="pass">Passed</button>
    <button class="filter-btn" data-filter="pending">Pending</button>
  </div>
  <div id="test-list"></div>
</div>

<div id="main">
  <div id="app-frame-wrap">
    <iframe id="app-frame" src="" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"></iframe>
    <div id="overlay-msg">Loading…</div>
  </div>
  <div id="log-header" style="display:flex;align-items:center;gap:8px;padding:6px 16px;border-top:1.5px solid var(--border);background:#f8f7f4;flex-shrink:0;">
    <span style="font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-faint);">Log</span>
    <button class="ctrl" id="btn-copy-all" style="padding:3px 10px;font-size:10px;">⎘ Copy All</button>
    <button class="ctrl" id="btn-copy-failed" style="padding:3px 10px;font-size:10px;">⎘ Copy Failed</button>
  </div>
  <div id="log-panel"></div>
</div>

<script>
// ── Test definitions ──────────────────────────────────────────────────────────
// Each test: { id, group, name, fn: async(frame, win, doc) => pass|fail|skip }
// Return true = pass, false = fail, 'skip' = skip, throw = fail with message

const TESTS = [];
function test(group, name, fn) { TESTS.push({ id: TESTS.length, group, name, fn, status: 'pending', error: null }); }

function q(doc, sel) { return doc.querySelector(sel); }
function qq(doc, sel) { return [...doc.querySelectorAll(sel)]; }
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function click(el) { el && el.click(); }
function setVal(el, val) {
  if (!el) return;
  if (el.contentEditable === 'true') { el.innerHTML = val; el.dispatchEvent(new Event('input', {bubbles:true})); }
  else { el.value = val; el.dispatchEvent(new Event('input', {bubbles:true})); }
}
function triggerInput(el) { el && el.dispatchEvent(new Event('input', {bubbles:true})); }

async function openWatermarkPanel(doc) {
  click(q(doc, '#bg-toggle'));
  await sleep(200);
  click(q(doc, '#bg-tab-colour'));
  await sleep(100);
  const row = q(doc, '#bg-watermark-row');
  if (row && row.style.display !== 'flex') {
    click(q(doc, '#bg-watermark-toggle'));
    await sleep(200);
  }
}

// Helper: wait for condition with timeout
async function waitFor(fn, timeout=2000, interval=50) {
  const start = Date.now();
  while (Date.now() - start < timeout) {
    if (fn()) return true;
    await sleep(interval);
  }
  return false;
}

// ── Group 1: Text input & live preview ──────────────────────────────────────
test('Text Input', 'Quick Start shown on fresh load', async (fr, win, doc) => {
  const pt = q(doc, '#print-text');
  if (!pt) throw 'No #print-text element';
  await waitFor(() => pt.innerHTML.trim().length > 0, 4000);
  const html = pt.innerHTML;
  return html.includes('QUICK START') || html.includes('Quick Start') || html.includes('快速') || html.includes('クイック') || html.includes('빠른');
});

test('Text Input', 'Text input has focus on load', async (fr, win, doc) => {
  await sleep(200);
  return doc.activeElement && doc.activeElement.id === 'text-input';
});

test('Text Input', 'Typing text updates preview', async (fr, win, doc) => {
  const ti = q(doc, '#text-input');
  setVal(ti, 'HELLO');
  await sleep(300);
  return q(doc, '#print-text').innerText.includes('HELLO');
});

test('Text Input', 'Date pattern splits into multiple lines', async (fr, win, doc) => {
  const ti = q(doc, '#text-input');
  // '通知7月25日7月26日休息' → 4 lines: '通知', '7月25日', '7月26日', '休息'
  setVal(ti, '通知7月25日7月26日休息');
  await sleep(300);
  const html = q(doc, '#print-text').innerHTML;
  const breaks = (html.match(/<br>/g) || []).length;
  if (breaks !== 3) throw `Expected 3 <br> tags (4 lines), got ${breaks}`;
  return true;
});

test('Text Input', 'Clearing text restores Quick Start', async (fr, win, doc) => {
  const ti = q(doc, '#text-input');
  setVal(ti, '');
  await sleep(400);
  const pt = q(doc, '#print-text');
  const html = pt.innerHTML;
  return html.includes('QUICK START') || html.includes('Quick Start') || html.includes('快速') || html.includes('クイック') || html.includes('빠른');
});

test('Text Input', 'Paste strips HTML formatting', async (fr, win, doc) => {
  const ti = q(doc, '#text-input');
  const dt = new DataTransfer();
  dt.setData('text/plain', 'PlainPaste');
  dt.setData('text/html', '<b style="color:red">PlainPaste</b>');
  ti.dispatchEvent(new ClipboardEvent('paste', { clipboardData: dt, bubbles: true, cancelable: true }));
  await sleep(200);
  // result should contain PlainPaste without <b> tags
  return ti.innerHTML.includes('PlainPaste') && !ti.innerHTML.includes('<b');
});

test('Text Input', 'Brackets stay with date pattern (no extra split)', async (fr, win, doc) => {
  const ti = q(doc, '#text-input');
  setVal(ti, '通知7月25日()7月26日()休息');
  await sleep(400);
  const html = q(doc, '#print-text').innerHTML;
  const breaks = (html.match(/<br>/g) || []).length;
  if (breaks !== 3) throw `Expected 3 <br> tags (4 lines), got ${breaks}. HTML: ${html}`;
  return true;
});

test('Text Input', 'Orientation auto-selects on new text (not locked to Quick Start)', async (fr, win, doc) => {
  // Quick Start renders in landscape; typing tall content should switch to portrait
  const ti = q(doc, '#text-input');
  setVal(ti, '通知\n第一行\n第二行\n第三行\n第四行');
  await sleep(500);
  // tall content (5 lines) should favour portrait
  const orientation = q(doc, '#a4-page').className;
  return orientation === 'portrait';
});

test('Text Input', 'Multi-line content selects portrait orientation', async (fr, win, doc) => {
  // "1\n2" typed via Enter key should select portrait (taller content)
  const ti = q(doc, '#text-input');
  ti.innerHTML = '<div>1</div><div>2</div>';
  ti.dispatchEvent(new Event('input', {bubbles: true}));
  await sleep(500);
  const orientation = q(doc, '#a4-page').className;
  if (orientation !== 'portrait') throw `Expected portrait for 2-line content, got ${orientation}`;
  return true;
});

test('Text Input', 'Multi-line content does not overflow page height', async (fr, win, doc) => {
  const ti = q(doc, '#text-input');
  ti.innerHTML = '<div>1</div><div>2</div><div>3</div>';
  ti.dispatchEvent(new Event('input', {bubbles: true}));
  await sleep(500);
  const pt = q(doc, '#print-text');
  const page = q(doc, '#a4-page');
  const cs = win.getComputedStyle(page);
  const pageH = page.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  if (pt.scrollHeight > pageH + 2) throw `Content ${pt.scrollHeight}px overflows page ${pageH}px`;
  return true;
});

test('Text Input', 'Double br tags collapsed to single br', async (fr, win, doc) => {
  // Typing 1 Enter 2 should produce 1<br>2 not 1<br><br>2
  const ti = q(doc, '#text-input');
  ti.innerHTML = '<div>1</div><div>2</div>';
  ti.dispatchEvent(new Event('input', {bubbles: true}));
  await sleep(400);
  const html = q(doc, '#print-text').innerHTML;
  const brCount = (html.match(/<br>/g) || []).length;
  if (brCount !== 1) throw `Expected 1 <br>, got ${brCount}. HTML: ${html}`;
  return true;
});

test('Text Input', 'htmlToPlain handles mixed div structure correctly', async (fr, win, doc) => {
  // "1<div>2</div><div>3</div>" should give "1\n2\n3" (3 lines)
  const plain = win.htmlToPlain('1<div>2</div><div>3</div>').trim();
  const lines = plain.split('\n');
  if (lines.length !== 3) throw `Expected 3 lines, got ${lines.length}: ${JSON.stringify(plain)}`;
  if (lines[0] !== '1' || lines[1] !== '2' || lines[2] !== '3') throw `Wrong lines: ${JSON.stringify(lines)}`;
  return true;
});

test('Text Input', 'Typing 1 Enter 2 Enter 3 gives correct font size', async (fr, win, doc) => {
  const ti = q(doc, '#text-input');
  // Simulate keyboard typing
  ti.focus();
  doc.execCommand('insertText', false, '1');
  ti.dispatchEvent(new Event('input', {bubbles: true}));
  doc.execCommand('insertParagraph', false);
  ti.dispatchEvent(new Event('input', {bubbles: true}));
  doc.execCommand('insertText', false, '2');
  ti.dispatchEvent(new Event('input', {bubbles: true}));
  doc.execCommand('insertParagraph', false);
  ti.dispatchEvent(new Event('input', {bubbles: true}));
  doc.execCommand('insertText', false, '3');
  ti.dispatchEvent(new Event('input', {bubbles: true}));
  await sleep(500);
  const pt = q(doc, '#print-text');
  const page = q(doc, '#a4-page');
  const cs = win.getComputedStyle(page);
  const pageH = page.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  if (pt.scrollHeight > pageH + 2) throw `Content ${pt.scrollHeight}px overflows page ${pageH}px`;
  // Font should be reasonable (not tiny) — at least 150px for 3 single chars
  const fontSize = parseInt(pt.style.fontSize);
  if (fontSize < 130) throw `Font too small: ${fontSize}px`;
  return true;
});

test('Text Input', 'Auto-wrap toggle does not cause overflow', async (fr, win, doc) => {
  const ti = q(doc, '#text-input');
  ti.innerHTML = '<div>1</div><div>2</div><div>3</div>';
  ti.dispatchEvent(new Event('input', {bubbles: true}));
  await sleep(400);
  // Toggle wrap OFF and ON
  click(q(doc, '#toggle-wrap'));
  await sleep(400);
  click(q(doc, '#toggle-wrap'));
  await sleep(400);
  const pt = q(doc, '#print-text');
  const page = q(doc, '#a4-page');
  const cs = win.getComputedStyle(page);
  const pageH = page.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  if (pt.scrollHeight > pageH + 2) throw `After wrap toggle, content ${pt.scrollHeight}px overflows page ${pageH}px`;
  return true;
});

// ── Group 2: Rich text formatting ────────────────────────────────────────────
test('Rich Text', 'Bold button exists in toolbar', async (fr, win, doc) => {
  return !!q(doc, '#rich-bold');
});

test('Rich Text', 'Italic button exists in toolbar', async (fr, win, doc) => {
  return !!q(doc, '#rich-italic');
});

test('Rich Text', 'Underline button exists in toolbar', async (fr, win, doc) => {
  return !!q(doc, '#rich-underline');
});

test('Rich Text', 'Text colour picker exists', async (fr, win, doc) => {
  return !!q(doc, '#rich-color');
});

test('Rich Text', 'Highlight colour picker exists', async (fr, win, doc) => {
  return !!q(doc, '#rich-bg-color');
});

test('Rich Text', 'Clear format button exists', async (fr, win, doc) => {
  return !!q(doc, '#rich-clear-format');
});

// ── Group 3: Action buttons ───────────────────────────────────────────────────
test('Action Buttons', 'Rotate button exists', async (fr, win, doc) => {
  return !!q(doc, '#rotate-btn');
});

test('Action Buttons', 'Rotate toggles orientation', async (fr, win, doc) => {
  const ti = q(doc, '#text-input');
  setVal(ti, 'ROTATE TEST');
  await sleep(400);
  const page = q(doc, '#a4-page');
  const before = page.className;
  click(q(doc, '#rotate-btn'));
  await sleep(400);
  const after = page.className;
  return before !== after && (after === 'landscape' || after === 'portrait');
});

test('Action Buttons', 'Background toggle opens panel', async (fr, win, doc) => {
  const panel = q(doc, '#bg-panel');
  const wasOpen = panel.style.display === 'flex';
  click(q(doc, '#bg-toggle'));
  await sleep(200);
  const nowOpen = panel.style.display === 'flex';
  if (wasOpen === nowOpen) return false;
  click(q(doc, '#bg-toggle')); // close again
  return true;
});

test('Action Buttons', 'Print button is right-aligned', async (fr, win, doc) => {
  const btn = q(doc, '#print-btn');
  return btn && (btn.style.marginLeft === 'auto' || getComputedStyle(btn).marginLeft !== '0px');
});

test('Action Buttons', 'Print button is bold', async (fr, win, doc) => {
  const btn = q(doc, '#print-btn');
  return btn && getComputedStyle(btn).fontWeight >= 700;
});

test('Action Buttons', 'Print preserves manual rotation', async (fr, win, doc) => {
  setVal(q(doc, '#text-input'), 'Test rotation');
  await sleep(400);
  const before = q(doc, '#a4-page').className;
  click(q(doc, '#rotate-btn'));
  await sleep(300);
  const afterRotate = q(doc, '#a4-page').className;
  if (afterRotate === before) throw 'Rotate did not change orientation';
  // Now click print — orientation should NOT flip back
  // We can't call window.print() in tests, so just check renderText preserves orientation
  const raw = q(doc, '#text-input').innerHTML.trim();
  win._manualRotation = true; // ensure flag is set
  q(doc, '#text-input').dispatchEvent(new Event('input', {bubbles: true}));
  await sleep(300);
  const afterPrint = q(doc, '#a4-page').className;
  if (afterPrint !== afterRotate) throw `Orientation changed from ${afterRotate} to ${afterPrint} after input`;
  return true;
});

// ── Group 4: Font/size/paper controls ────────────────────────────────────────
test('Controls', 'Font/size/paper buttons hidden initially', async (fr, win, doc) => {
  const fl = q(doc, '#toggle-font-list');
  const fs = q(doc, '#toggle-font-size-ctrl');
  const fp = q(doc, '#toggle-paper-size-ctrl');
  if (!fl) throw 'Missing #toggle-font-list';
  if (!fs) throw 'Missing #toggle-font-size-ctrl';
  if (!fp) throw 'Missing #toggle-paper-size-ctrl';
  // After previous tests typed text, these may already be visible — just verify they exist
  return true;
});

test('Controls', 'After preview, toggle buttons appear', async (fr, win, doc) => {
  setVal(q(doc, '#text-input'), 'Controls test');
  await sleep(400);
  const fl = q(doc, '#toggle-font-list');
  return fl && fl.style.display !== 'none';
});

test('Controls', 'Typeface toggle shows font panel', async (fr, win, doc) => {
  click(q(doc, '#toggle-font-list'));
  await sleep(200);
  const panel = q(doc, '#font-list');
  const visible = panel && panel.style.display === 'flex';
  click(q(doc, '#toggle-font-list')); // close
  return visible;
});

test('Controls', 'Font Size toggle shows size controls', async (fr, win, doc) => {
  click(q(doc, '#toggle-font-size-ctrl'));
  await sleep(200);
  const panel = q(doc, '#font-size-ctrl');
  const visible = panel && panel.style.display === 'flex';
  click(q(doc, '#toggle-font-size-ctrl')); // close
  return visible;
});

test('Controls', 'Paper toggle shows paper size controls', async (fr, win, doc) => {
  click(q(doc, '#toggle-paper-size-ctrl'));
  await sleep(200);
  const panel = q(doc, '#paper-size-ctrl');
  const visible = panel && panel.style.display === 'flex';
  click(q(doc, '#toggle-paper-size-ctrl')); // close
  return visible;
});

test('Controls', 'Background toggle shows bg panel', async (fr, win, doc) => {
  const panel = q(doc, '#bg-panel');
  click(q(doc, '#bg-toggle'));
  await sleep(200);
  const visible = panel.style.display === 'flex';
  click(q(doc, '#bg-toggle')); // close
  return visible;
});

test('Controls', 'Font size − button decreases size', async (fr, win, doc) => {
  const display = q(doc, '#font-size-display');
  const before = parseInt(display.textContent);
  const btn = q(doc, '#font-dec');
  btn.dispatchEvent(new MouseEvent('mousedown', {bubbles: true}));
  btn.dispatchEvent(new MouseEvent('mouseup', {bubbles: true}));
  await sleep(200);
  const after = parseInt(display.textContent);
  return after === before - 1;
});

test('Controls', 'Font size + button increases size', async (fr, win, doc) => {
  const display = q(doc, '#font-size-display');
  const before = parseInt(display.textContent);
  const btn = q(doc, '#font-inc');
  btn.dispatchEvent(new MouseEvent('mousedown', {bubbles: true}));
  btn.dispatchEvent(new MouseEvent('mouseup', {bubbles: true}));
  await sleep(200);
  const after = parseInt(display.textContent);
  return after === before + 1;
});

test('Controls', 'Fit button recalculates font size', async (fr, win, doc) => {
  const display = q(doc, '#font-size-display');
  const dec = q(doc, '#font-dec');
  dec.dispatchEvent(new MouseEvent('mousedown', {bubbles: true}));
  dec.dispatchEvent(new MouseEvent('mouseup', {bubbles: true}));
  await sleep(100);
  dec.dispatchEvent(new MouseEvent('mousedown', {bubbles: true}));
  dec.dispatchEvent(new MouseEvent('mouseup', {bubbles: true}));
  await sleep(100);
  const before = parseInt(display.textContent);
  click(q(doc, '#font-reset'));
  await sleep(300);
  const after = parseInt(display.textContent);
  return after !== before;
});

test('Controls', 'Paper size buttons exist', async (fr, win, doc) => {
  return qq(doc, '.paper-btn').length >= 6;
});

// ── Runner ────────────────────────────────────────────────────────────────────
let running = false;
let stopFlag = false;
let currentFilter = 'all';
let startTime = null;

const frame = document.getElementById('app-frame');
const logEl = document.getElementById('log-panel');
const overlay = document.getElementById('overlay-msg');

function log(msg, type='info') {
  const line = document.createElement('div');
  line.className = 'log-line ' + type;
  line.textContent = msg;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}

function setOverlay(msg) {
  overlay.textContent = msg;
  overlay.classList.toggle('visible', !!msg);
}

function getIcon(status) {
  return { pass: '✓', fail: '✗', skip: '⊘', pending: '○', running: '…' }[status] || '○';
}

function updateCounts() {
  const counts = { pass: 0, fail: 0, skip: 0, pending: 0 };
  TESTS.forEach(t => counts[t.status] = (counts[t.status] || 0) + 1);
  document.getElementById('cnt-pass').textContent = counts.pass + ' pass';
  document.getElementById('cnt-fail').textContent = counts.fail + ' fail';
  document.getElementById('cnt-skip').textContent = counts.skip + ' skip';
  document.getElementById('cnt-pending').textContent = counts.pending + ' pending';
  const done = counts.pass + counts.fail + counts.skip;
  const total = TESTS.length;
  document.getElementById('progress-bar').style.width = (done / total * 100) + '%';
  document.getElementById('progress-bar').style.background = counts.fail > 0 ? 'var(--fail)' : 'var(--pass)';
  if (startTime) {
    const secs = ((Date.now() - startTime) / 1000).toFixed(1);
    document.getElementById('elapsed').textContent = secs + 's';
  }
}

function renderList() {
  const list = document.getElementById('test-list');
  list.innerHTML = '';
  const groups = {};
  TESTS.forEach(t => {
    if (currentFilter !== 'all' && t.status !== currentFilter) return;
    if (!groups[t.group]) groups[t.group] = [];
    groups[t.group].push(t);
  });
  Object.entries(groups).forEach(([group, tests]) => {
    const header = document.createElement('div');
    header.className = 'group-header';
    const pass = tests.filter(t => t.status === 'pass').length;
    const fail = tests.filter(t => t.status === 'fail').length;
    header.innerHTML = `<span>${group}</span><span class="group-count">${pass}✓ ${fail}✗ / ${tests.length}</span>`;
    list.appendChild(header);
    tests.forEach(t => {
      const item = document.createElement('div');
      item.className = 'test-item' + (t._current ? ' current' : '');
      item.dataset.id = t.id;
      item.innerHTML = `
        <div class="test-icon" style="color:var(--${t.status === 'pending' ? 'pending' : t.status === 'running' ? 'pending' : t.status})">${getIcon(t.status)}</div>
        <div>
          <div class="test-name">${t.name}</div>
          ${t.error ? `<div class="test-error">${t.error}</div>` : ''}
        </div>`;
      item.addEventListener('click', () => runSingle(t.id));
      list.appendChild(item);
    });
  });
}

async function reloadFrame() {
  return new Promise(resolve => {
    frame.onload = () => { frame.onload = null; resolve(); };
    frame.src = targetFile + '?' + Date.now();
  });
}

async function waitFrameReady() {
  await waitFor(() => {
    try {
      const doc = frame.contentDocument;
      return doc && doc.readyState === 'complete' && doc.getElementById('text-input');
    } catch(e) { return false; }
  }, 5000);
  await sleep(500); // let JS init finish
}

async function runTest(t) {
  t.status = 'running'; t._current = true; t.error = null;
  renderList();
  try {
    const win = frame.contentWindow;
    const doc = frame.contentDocument;
    const result = await t.fn(frame, win, doc);
    if (result === 'skip') { t.status = 'skip'; log('⊘ SKIP  ' + t.name, 'skip'); }
    else if (result === true) { t.status = 'pass'; log('✓ PASS  ' + t.name, 'pass'); }
    else { t.status = 'fail'; t.error = 'Assertion returned false'; log('✗ FAIL  ' + t.name, 'fail'); }
  } catch(e) {
    t.status = 'fail'; t.error = String(e.message || e);
    log('✗ FAIL  ' + t.name + ' — ' + t.error, 'fail');
  }
  t._current = false;
  updateCounts();
  renderList();
}

async function runAll(testsToRun) {
  if (running) return;
  running = true; stopFlag = false; startTime = Date.now();
  document.getElementById('btn-run-all').disabled = true;
  document.getElementById('btn-run-failed').disabled = true;
  document.getElementById('btn-stop').disabled = false;
  setOverlay('Reloading app…');
  log('── Starting test run ──', 'info');
  await reloadFrame();
  await waitFrameReady();
  setOverlay('');
  for (const t of testsToRun) {
    if (stopFlag) { log('── Run stopped ──', 'warn'); break; }
    await runTest(t);
  }
  running = false;
  document.getElementById('btn-run-all').disabled = false;
  document.getElementById('btn-run-failed').disabled = TESTS.filter(t => t.status === 'fail').length === 0;
  document.getElementById('btn-stop').disabled = true;
  const pass = TESTS.filter(t => t.status === 'pass').length;
  const fail = TESTS.filter(t => t.status === 'fail').length;
  log(`── Done: ${pass} passed, ${fail} failed ──`, fail > 0 ? 'fail' : 'pass');
}

async function runSingle(id) {
  if (running) return;
  const t = TESTS.find(x => x.id === id);
  if (!t) return;
  running = true;
  document.getElementById('btn-run-all').disabled = true;
  document.getElementById('btn-stop').disabled = false;
  await runTest(t);
  running = false;
  document.getElementById('btn-run-all').disabled = false;
  document.getElementById('btn-stop').disabled = true;
  document.getElementById('btn-run-failed').disabled = TESTS.filter(t => t.status === 'fail').length === 0;
}

document.getElementById('btn-run-all').addEventListener('click', () => runAll(TESTS));
document.getElementById('btn-run-failed').addEventListener('click', () => runAll(TESTS.filter(t => t.status === 'fail')));
document.getElementById('btn-stop').addEventListener('click', () => { stopFlag = true; });
document.getElementById('btn-reset').addEventListener('click', () => {
  if (running) return;
  TESTS.forEach(t => { t.status = 'pending'; t.error = null; });
  logEl.innerHTML = '';
  document.getElementById('btn-run-failed').disabled = true;
  startTime = null;
  document.getElementById('elapsed').textContent = '';
  updateCounts();
  renderList();
  reloadFrame().then(() => log('App reloaded.', 'info'));
});

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderList();
  });
});

// ── Target file from URL param ────────────────────────────────────────────────
var targetFile = new URLSearchParams(window.location.search).get('target') || 'one-page-studio.html';
frame.src = targetFile;
document.querySelector('#sidebar-header h1').textContent = 'Regression Tests — ' + targetFile;

// Init
frame.addEventListener('load', () => setOverlay(''));
setOverlay('Loading app…');
updateCounts();
renderList();
log('Testing: ' + targetFile, 'info');
log('Test runner ready. Click "Run All" to start.', 'info');

document.getElementById('btn-copy-all').addEventListener('click', function () {
  var text = [...logEl.querySelectorAll('.log-line')].map(l => l.textContent).join('\n');
  navigator.clipboard.writeText(text).then(() => log('✓ Copied all logs', 'info'));
});

document.getElementById('btn-copy-failed').addEventListener('click', function () {
  var failed = TESTS.filter(t => t.status === 'fail')
    .map(t => '✗ FAIL  ' + t.group + ' / ' + t.name + (t.error ? ' — ' + t.error : ''))
    .join('\n');
  if (!failed) { log('No failed tests to copy', 'info'); return; }
  navigator.clipboard.writeText(failed).then(() => log('✓ Copied ' + TESTS.filter(t=>t.status==='fail').length + ' failed tests', 'info'));
});
